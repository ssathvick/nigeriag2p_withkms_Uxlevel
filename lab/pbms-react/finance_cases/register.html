<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finance case register | PBMS</title><style>
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:#f4f7f5;color:#193b34;font:16px/1.5 "Segoe UI",sans-serif}header{background:#123e34;color:white;padding:1rem max(5vw,1rem);display:flex;align-items:center;justify-content:space-between}a{color:inherit}main{max-width:1180px;margin:2rem auto;padding:0 1rem}h1{font-size:2rem;margin:.3rem 0}h2{font-size:1.25rem;margin:0 0 .8rem}section{background:white;border:1px solid #cfded6;border-radius:8px;padding:1.3rem;margin:1rem 0}label{display:flex;flex-direction:column;gap:.2rem;font-size:.89rem;font-weight:600}input,select,textarea,button{font:inherit;color:inherit;padding:.48rem .7rem;border:1px solid #9fb6ad;border-radius:4px}button{cursor:pointer;background:#17634f;color:white;border-color:#17634f}button:disabled{opacity:.55}button:hover:enabled{background:#114e3f}button.link{color:#185c4a;background:#eff6f1}form,.bar{display:flex;align-items:end;gap:.7rem;flex-wrap:wrap}form{margin:1rem 0}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{text-align:left;vertical-align:top;border-bottom:1px solid #dee7e1;padding:.55rem}th{background:#eff5f1}p{margin:.5rem 0}#msg{position:sticky;top:0;background:#fff2cd;padding:.5rem;z-index:1}#msg:empty{display:none}#history details{border-bottom:1px solid #dae5df;padding:.5rem}summary{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;font: .84rem/1.5 monospace}textarea{width:min(42rem,90%);height:4rem}.muted{color:#50675e;font-size:.9rem}
</style></head><body><header><a id="back" href="/pbms-ui/#programme-flow">← PBMS programme flow</a><span id="me"></span></header><main><h1>Finance case register</h1><p class="muted">Sandbox procedures · Finance approval pending</p><div id="msg" role="status" aria-live="polite"></div>
<section><h2>Programme cases</h2><div class="bar"><label>Find a case or instruction<input id="filter" type="search"></label><label>Queue<select id="queue"><option>All cases</option><option>Sent to Finance</option><option>Acknowledged</option><option>Recorded</option><option>Reviewed</option><option>Closed</option></select></label><button id="refresh" class="link">Refresh register</button></div><div id="cases" class="scroll"></div></section>
<section><h2>Instruction evidence</h2><form id="search"><label>PBMS list ID<input type="number" required min="1" id="lid"></label><label>Original instruction ID<input id="iid" placeholder="All instructions in this list"></label><label>Evidence cutoff in UTC (optional)<input id="cut" placeholder="YYYY-MM-DDTHH:MM:SSZ"></label><button>Look up evidence</button></form><p id="totals"></p><div id="results" class="scroll"></div><div id="evidence"></div></section>
<section id="casebox" hidden><h2 id="heading"></h2><p id="state"></p><label id="outlabel">Instruction outcome<select id="outcome"><option>Pending</option><option>Reconciled</option><option>Reversed</option></select></label><label id="receiptlabel">Later statement receipt<select id="receipt"></select></label><label>Case note<textarea id="note" maxlength="1500"></textarea></label><div id="actions" class="bar"></div><h3>Case history</h3><div id="history"></div></section></main><script>
'use strict';
const $=s=>document.getElementById(s), el=(tag,txt)=>{let n=document.createElement(tag);if(txt!==undefined)n.textContent=txt;return n};
let board={},current=null,selected=null,packet=null,busy=false;
const names={create:'Create case',send:'Send to Finance',acknowledge:'Acknowledge receipt',record:'Record outcome',review:'Confirm independent review',close:'Close case',note:'Append later evidence'};
async function api(path,data){let r=await fetch('/pbms-ui-api/finance-register/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});let j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
async function work(fn){if(busy)return;busy=true;$('msg').textContent='';try{await fn()}catch(e){$('msg').textContent=e.message}finally{busy=false}}
function btn(label,fn){let n=el('button',label);n.type='button';n.onclick=()=>work(fn);return n}
function grid(id,cols,rows){let node=typeof id==='string'?$(id):id;node.replaceChildren();if(!rows.length){node.append(el('p','No matching records.'));return}let t=el('table'),head=t.createTHead().insertRow();cols.forEach(x=>head.append(el('th',x)));let body=t.createTBody();for(let row of rows){let tr=body.insertRow();row.forEach(x=>{let td=tr.insertCell();x instanceof Node?td.append(x):td.textContent=x??'—'})}node.append(t)}
async function refresh(){board=await api('queue',{});$('me').textContent=board.name+' · '+board.roles.join(', ');drawQueue()}
function drawQueue(){let f=$('filter').value.toLowerCase(),s=$('queue').value;grid('cases',['Case','List','Instruction','Status','Outcome'],(board.cases||[]).filter(c=>(s==='All cases'||c.state===s)&&(c.ref+' '+c.instruction).toLowerCase().includes(f)).map(c=>[btn(c.ref,()=>openCase(c)),c.list_id,c.instruction,c.state,c.outcome]))}
function reset(){current=null;selected=null;packet=null;$('results').replaceChildren();$('evidence').replaceChildren();$('totals').textContent='';$('casebox').hidden=true}
function params(){return {as_of:$('cut').value.trim()}}
async function lookup(){reset();packet=await api($('lid').value,{action:'lookup',instruction:$('iid').value.trim(),...params()});const totals={Pending:0,Reconciled:0,Reversed:0};packet.rows.forEach(r=>totals[r.supported]++);$('totals').textContent=packet.program+' · List '+packet.list_id+' · Revision '+packet.revision+' · Evidence at '+packet.as_of_utc+' · Displayed instructions '+packet.rows.length+' · '+Object.entries(totals).map(x=>x.join(' ')).join(' / ');
const totalsByCurrency=new Map();for(const r of packet.rows){const totals=totalsByCurrency.get(r.currency)||{Pending:0,Reconciled:0,Reversed:0};totals[r.supported]+=Number(r.approved_amount||0);totalsByCurrency.set(r.currency,totals)}
for(const [currency,byState] of totalsByCurrency){$('totals').append(el('p','Approved amounts ('+currency+'): '+Object.entries(byState).map(([k,v])=>k+' '+v.toFixed(2)).join(' / ')))}
for(const env of packet.envelope_totals){$('totals').append(el('p','PBMS envelope '+env.disbursement_envelope_id+' · Beneficiaries '+env.number_of_beneficiaries+' · Total '+env.total_disbursement_quantity+' '+env.measurement_unit))}
grid('results',['Instruction','Approved','Issued','Evidence supports',''],packet.rows.map(r=>[r.instruction,r.currency+' '+r.approved_amount,r.issued_amount,r.supported,btn('Inspect '+r.instruction,()=>choose(r))]))}
function choose(r){selected=r;let c=board.cases.find(c=>c.list_id===packet.list_id&&c.instruction===r.instruction);if(c)return openCase(c);current=null;draw()}
async function openCase(c){$('lid').value=c.list_id;$('iid').value=c.instruction;await lookup();selected=packet.rows[0];current=await api(c.list_id,{action:'read',ref:c.ref,...params()});draw()}
function draw(){const e=$('evidence');e.replaceChildren();e.append(el('h3','Bank evidence for '+selected.instruction),el('p','Envelope '+selected.envelope+' · Batch '+selected.batch));if(selected.amount_exception)e.append(el('p','Amount or currency exception: review the differing statement entry.'));let g=el('div');g.className='scroll';e.append(g);grid(g,['Receipt','Statement / entry','Processed UTC','Movement','Bank reference','Amount'],selected.entries.map(x=>[x.receipt,x.statement+' / '+x.entry_number,x.processed_at,x.direction,x.bank_ref,x.currency+' '+x.amount]));
$('casebox').hidden=false;$('heading').textContent=current?current.ref:'New instruction case';$('state').textContent=current?current.state+' · '+(current.outcome||'No recorded outcome'):'Payment may create a case for this instruction.';$('history').replaceChildren();
for(const v of current?.events||[]){let d=el('details');d.append(el('summary',v.version+' · '+names[v.action]+' · '+v.name+' · '+v.at),el('p',v.note),el('pre',JSON.stringify(v.snapshot,null,2)));$('history').append(d)}
let available=current?({'Open':['send'],'Sent to Finance':['acknowledge'],'Acknowledged':['record'],'Recorded':['record','review'],'Reviewed':['record','close'],'Closed':['note']}[current.state]||[]):['create'];
available=available.filter(a=>board.roles.includes(['create','send'].includes(a)?'Payment':'Finance'));$('outlabel').hidden=!available.includes('record');$('receiptlabel').hidden=!available.includes('note');$('receipt').replaceChildren(...selected.entries.map(x=>{let n=el('option',x.receipt+' / entry '+x.entry_number+' / '+x.direction+' '+x.amount);n.value=x.receipt+'|'+x.entry_number;return n}));$('actions').replaceChildren(...available.map(a=>btn(names[a],()=>change(a))));$('note').value=''}
async function change(action){const note=$('note').value.trim();if(note.length<3)throw Error('Enter a case note.');const result=await api(packet.list_id,{action,ref:current?.ref,version:current?.version,instruction:selected.instruction,note,outcome:$('outcome').value,receipt:$('receipt').value.split('|')[0],entry:Number($('receipt').value.split('|')[1]),request_id:crypto.randomUUID(),...params()});current=result;await refresh();draw();$('msg').textContent=names[action]+' saved · '+result.ref}
$('search').onsubmit=e=>{e.preventDefault();work(lookup)};$('queue').onchange=drawQueue;$('filter').oninput=drawQueue;$('refresh').onclick=()=>work(refresh);
for(let id of ['cut','lid','iid'])$(id).oninput=reset;
const initial=new URLSearchParams(location.search).get('list');if(initial&&/^\d+$/.test(initial))$('lid').value=initial;
work(async()=>{await refresh();if($('lid').value)await lookup()});
</script></body></html>
